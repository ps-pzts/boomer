[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boomer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "kiteconnect>=5.2.2",  # market_protection support (#43)
    "pyotp>=2.9",
    "pyarrow>=15",  # minute-bar parquet (designs/intraday-live-pipeline.md §3.2)
    "fastapi>=0.110",  # observability web UI (#105); the old dashboard used it undeclared
    "uvicorn>=0.29",
    "websockets>=12",  # uvicorn's WebSocket backend for /ws/live
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "httpx>=0.27",  # FastAPI TestClient
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["simulate.py"]  # legacy demo script, not part of the src package

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# live_kite tests hit the real Kite account (#85): opt-in only, never in CI.
addopts = "-x --tb=short -m 'not live_kite'"
markers = [
    "live_kite: talks to the real Kite account; run with BOOMER_LIVE_KITE=1 pytest -m live_kite",
]

[tool.setuptools.packages.find]
where = ["src"]
